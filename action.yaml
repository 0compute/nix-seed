name: Nix Seed Build
description: Builder for Nix Seed

inputs:

  path:
    description: Path to flake.nix
    default: .

  seed_attr:
    description: Flake package attribute of the seed to consume
    default: seed

  attr:
    description: >-
      Flake package attribute to build from the seed. The seed bakes every
      harvested output, so any packages.<system>.<name> can be named here.
    default: default

  github_token:
    description: GitHub Token

runs:
  using: composite
  steps:

    # the seed digest keys the image cache: same digest -> same bytes, so
    # the entry is immutable and restored in-datacenter instead of pulled
    # from ghcr. ghcr stays the durable, verifiable source of truth.
    - name: seed digest
      id: seed
      shell: bash
      run: |
        system=$(uname -m | sed s/arm64/aarch64/)-$(uname -s | tr '[:upper:]' '[:lower:]')
        # variant lock file: attr "seed" -> .seed.lock, "seed.drvs" ->
        # .seed-drvs.lock (mirrors bin/build-seed)
        suffix=${{ inputs.seed_attr }}
        lock=${{ inputs.path }}/.${suffix//./-}.lock
        digest=$(jq -er --arg s "$system" '.systems[$s]' "$lock")
        # digest keys the cache (key, minus the sha256: prefix) and is
        # reused by mount-seed (full digest), so the lock is read once.
        echo "lock=$lock" >>"$GITHUB_OUTPUT"
        echo "digest=$digest" >>"$GITHUB_OUTPUT"
        echo "key=${digest#sha256:}" >>"$GITHUB_OUTPUT"

    - name: cache pull
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/seed-cache
        key: seed-${{ runner.os }}-${{ runner.arch }}-${{ steps.seed.outputs.key }}
    - name: mount seed
      shell: bash
      env:
        REGISTRY_USER: ${{ github.actor }}
        REGISTRY_PASS: ${{ inputs.github_token }}
      run: |
        "$GITHUB_ACTION_PATH"/bin/mount-seed ${{ inputs.path }} \
          "$RUNNER_TEMP/seed" "$RUNNER_TEMP/seed-cache" \
          "${{ steps.seed.outputs.digest }}" \
          "${{ steps.seed.outputs.lock }}"

    - name: build
      shell: bash
      run: |-
        "$GITHUB_ACTION_PATH"/bin/build ${{ inputs.path }} "${{ inputs.attr }}"
