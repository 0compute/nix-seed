name: seed-examples

on:
  push:
    branches:
      - master
    paths:
      # any build-affecting change under an example (flake.nix, sources,
      # flake.lock) must re-seed; exclude .seed.lock so the seeder's own
      # `chore(seed): lock` commits don't retrigger this workflow.
      - examples/**
      - '!examples/**/.seed.lock'
      - .github/workflows/seed-examples.yaml
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      examples: ${{ steps.list.outputs.examples }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        uses: ./.github/actions/list-examples

  seed:
    needs: setup
    permissions:
      contents: write
      id-token: write
      packages: write
    strategy:
      matrix:
        example: ${{ fromJSON(needs.setup.outputs.examples) }}
        os:
          - ubuntu-22.04
          - ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./seed
        with:
          path: examples/${{ matrix.example }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
