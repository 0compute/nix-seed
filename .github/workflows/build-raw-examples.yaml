# baseline: plain `nix build` with the default substituter (cache.nixos.org)
# and no store cache -> non-substitutable paths recompile every run.
name: build-raw-examples

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      examples: ${{ steps.list.outputs.examples }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        uses: ./.github/actions/list-examples

  build:
    needs: setup
    permissions:
      contents: read
    strategy:
      matrix:
        example: ${{ fromJSON(needs.setup.outputs.examples) }}
        os:
          - ubuntu-22.04
          - ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: nixbuild/nix-quick-install-action@v35
      - run: nix build --print-build-logs examples/${{ matrix.example }}
