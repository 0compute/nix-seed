name: seed-drvs-examples

on:
  push:
    branches:
      - master
    paths:
      # any build-affecting change under an example must re-seed; exclude
      # both variants' lock files so the seeders' own `chore(...): lock`
      # commits don't retrigger this workflow.
      - examples/**
      - '!examples/**/.seed*.lock'
      # what the seed is made of, and what makes it: mkseed builds the
      # squashfs, flake.nix wires `lib.mkSeed = import ./mkseed`, and the
      # seed action + build-seed decide what gets pushed and locked. a
      # change here leaves every published seed stale while the build
      # workflows keep consuming it, so re-seed. consumer-side code
      # (bin/build, bin/mount-seed, action.yaml) is deliberately absent:
      # it cannot change a seed's contents, and builds test it on push.
      - mkseed/**
      - flake.nix
      - seed/action.yaml
      - bin/build-seed
      - .github/workflows/seed-drvs-examples.yaml
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      examples: ${{ steps.list.outputs.examples }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        uses: ./.github/actions/list-examples

  seed:
    needs: setup
    permissions:
      contents: write
      id-token: write
      packages: write
    strategy:
      matrix:
        example: ${{ fromJSON(needs.setup.outputs.examples) }}
        os:
          - ubuntu-22.04
          - ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./seed
        with:
          path: examples/${{ matrix.example }}
          # the zero-eval variant (doc/drv-seeds.md): recipes baked, no
          # flake-input sources; pushed as .../seed-drvs, locked in
          # .seed-drvs.lock
          seed_attr: seed.drvs
          github_token: ${{ secrets.GITHUB_TOKEN }}
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
