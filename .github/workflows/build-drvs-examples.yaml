# build each example from its drv-baked seed: pull + mount + zero-eval
# `nix-store --realise` of the baked recipe (doc/drv-seeds.md)
name: build-drvs-examples

on:
  push:
    branches:
      - master
    # ignore the paths seed-drvs-examples watches: a seed-affecting change
    # goes push -> seed-drvs-examples -> workflow_run -> here, so the build
    # never races ahead of its seed.
    paths-ignore:
      - flake.lock
      - examples/**
      - .github/workflows/seed-drvs-examples.yaml
  workflow_run:
    workflows:
      - seed-drvs-examples
    types:
      - completed
  workflow_dispatch:

jobs:
  setup:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      examples: ${{ steps.list.outputs.examples }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        uses: ./.github/actions/list-examples

  build:
    needs: setup
    permissions:
      contents: read
      id-token: write
      packages: read
    strategy:
      matrix:
        example: ${{ fromJSON(needs.setup.outputs.examples) }}
        os:
          - ubuntu-22.04
          - ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          path: examples/${{ matrix.example }}
          seed_attr: seed.drvs
          github_token: ${{ secrets.GITHUB_TOKEN }}
