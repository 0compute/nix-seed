# THROWAWAY. Stage 0 gate for macOS support (DESIGN.md#macos).
#
# Answers the questions a Linux machine cannot: can a compressed
# read-only disk image be attached at /nix on a sealed root volume, with
# `-shadow` as the writable layer, and will Nix load a database and build
# against the result unprivileged?
#
# Deliberately touches none of mkseed/, bin/ or the real workflows: if
# the mechanism does not hold up, deleting this file is the whole cost.
#
# Split in two jobs on purpose. `seed` has Nix installed and /nix
# occupied; `consume` is a fresh runner with NO Nix at all, which is the
# only honest test of "the seed provides everything".
name: spike-macos

on:
  workflow_dispatch:
    inputs:
      example:
        description: Example to seed
        default: hello/innocent
      runner:
        description: macOS runner label
        default: macos-latest

jobs:

  seed:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: runner identity
        run: |
          sw_vers
          uname -m
          df -h /
          echo "--- is / writable?"
          touch /nix-probe 2>&1 || echo "root volume is sealed, as expected"

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: build the closure a seed would bake
        id: closure
        run: |
          set -eux
          ex='${{ inputs.example }}'
          # what mkSeed roots: the target's build inputs, nix itself, and
          # the flake input sources needed to evaluate offline.
          inputdrv=$(nix build "./examples/$ex#default.inputDerivation" \
            --no-link --print-out-paths)
          # ^out: nixVersions.latest has several outputs and prints them
          # all, man first. we want the one with bin/nix.
          nixpkg=$(nix build 'nixpkgs#nixVersions.latest^out' \
            --no-link --print-out-paths)
          test -x "$nixpkg/bin/nix"

          # the flake itself and its DIRECT inputs only. recursing (`..`)
          # would drag in nix-seed's own dev toolchain -- emanote,
          # poetry2nix, nix-unit -- which mkSeed excludes via
          # excludeInputs and which would make the size comparison below
          # meaningless. building `default` never forces those.
          nix flake archive --json "./examples/$ex" \
            | jq -r '.path, (.inputs | to_entries[] | .value.path)' \
            | sort -u >flake-srcs.txt
          cat flake-srcs.txt

          { nix-store -qR "$inputdrv" "$nixpkg"
            xargs -n1 nix-store -qR <flake-srcs.txt
          } | sort -u >store-paths.txt
          wc -l store-paths.txt
          test -s store-paths.txt

          # registration in the exact format `nix-store --load-db` wants
          xargs nix-store --dump-db <store-paths.txt >registration
          wc -c registration
          test -s registration

          echo "nixpkg=$nixpkg" >>"$GITHUB_OUTPUT"
          xargs du -sh <store-paths.txt | tail -1 || true

      - name: build the disk image
        run: |
          set -eux
          work=$RUNNER_TEMP/img
          mkdir -p "$work"
          mnt=$RUNNER_TEMP/mnt

          # a case-sensitive filesystem is mandatory: the store has paths
          # differing only in case, and APFS defaults to insensitive.
          fs='Case-sensitive APFS'
          hdiutil create -size 4g -fs "$fs" -volname NixSeed \
            -type SPARSE -o "$work/rw" \
            || { fs='Case-sensitive HFS+'
                 echo "APFS failed, retrying with $fs"
                 hdiutil create -size 4g -fs "$fs" -volname NixSeed \
                   -type SPARSE -o "$work/rw"; }

          hdiutil attach "$work/rw.sparseimage" -mountpoint "$mnt" \
            -owners off -nobrowse -noautoopen

          # image layout is the whole of /nix: store, var, and the seed's
          # own metadata under .seed/
          mkdir -p "$mnt/store" "$mnt/var/nix" "$mnt/.seed"
          # ditto preserves modes and symlinks; the store paths are the
          # basenames of the closure.
          while read -r p; do
            ditto "$p" "$mnt/store/$(basename "$p")"
          done <store-paths.txt

          cp registration "$mnt/.seed/registration"
          # the spike skips buildEnv: record the nix path and let the
          # consumer put its bin/ on PATH directly.
          printf '%s\n' '${{ steps.closure.outputs.nixpkg }}' \
            >"$mnt/.seed/nixpath"
          cat >"$mnt/.seed/nix.conf" <<'EOF'
          experimental-features = nix-command flakes
          build-users-group =
          sandbox = false
          substitute = false
          substituters =
          fallback = false
          eval-cache = false
          EOF

          hdiutil detach "$mnt"

          # compare the compressed read-only formats; size drives restore
          # time, which is most of a warm job.
          for fmt in UDZO ULFO ULMO; do
            /usr/bin/time -p hdiutil convert "$work/rw.sparseimage" \
              -format "$fmt" -o "$work/store-$fmt.dmg" 2>&1 | tail -3
            printf '%-6s %s\n' "$fmt" \
              "$(du -h "$work/store-$fmt.dmg" | cut -f1)" >>"$work/sizes.txt"
          done
          echo "=== image sizes (compare against the linux squashfs)"
          cat "$work/sizes.txt"

          # ULFO (lzfse) is the expected pick: Apple's own, fast to
          # decompress. The consume job uses whichever we ship here.
          cp "$work/store-ULFO.dmg" "$work/store.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: spike-dmg
          path: ${{ runner.temp }}/img/store.dmg
          retention-days: 1

  consume:
    needs: seed
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v5
        with:
          name: spike-dmg
          path: ${{ runner.temp }}

      - name: no nix here
        run: |
          command -v nix && echo "UNEXPECTED: nix already present" || true
          ls -ld /nix 2>&1 || echo "no /nix, as expected"

      # Q1: can /nix exist at all on a sealed root volume, without a
      # reboot? This is how the Nix installers do it.
      - name: create /nix
        run: |
          set -eux
          printf 'nix\n' | sudo tee -a /etc/synthetic.conf
          sudo /System/Library/Filesystems/apfs.fs/Contents/Resources/apfs.util -B \
            || echo "apfs.util -B returned $?"
          sleep 2
          ls -ld /nix

      # Q2/Q3: attach constant-time, with the shadow as the writable
      # layer, owned (apparently) by the runner user.
      - name: attach the seed
        run: |
          set -eux
          start=$(date +%s.%N)
          sudo hdiutil attach "$RUNNER_TEMP/store.dmg" \
            -shadow "$RUNNER_TEMP/seed.shadow" \
            -mountpoint /nix \
            -owners off -nobrowse -noautoopen -noverify
          end=$(date +%s.%N)
          echo "attach took $(echo "$end - $start" | bc)s"
          mount | grep -i nix || true
          ls -l /nix
          ls -ld /nix/store /nix/var/nix
          echo "--- writable through the shadow?"
          touch /nix/store/.write-probe && echo "WRITABLE" || echo "NOT WRITABLE"
          id

      # Q4: does Nix accept a store it does not own, and will it build?
      - name: load the db and build offline
        run: |
          set -eux
          nixpath=$(cat /nix/.seed/nixpath)
          export PATH="$nixpath/bin:$PATH"
          nix --version

          sudo mkdir -p /etc/nix
          sudo ln -sf /nix/.seed/nix.conf /etc/nix/nix.conf

          nix-store --load-db </nix/.seed/registration
          echo "=== db loaded; store is valid?"
          nix-store --query --requisites "$nixpath" | wc -l

          start=$(date +%s.%N)
          nix build "./examples/${{ inputs.example }}" \
            --no-link --print-out-paths --print-build-logs
          end=$(date +%s.%N)
          echo "build took $(echo "$end - $start" | bc)s"

      - name: shadow growth
        if: always()
        run: ls -lh "$RUNNER_TEMP/seed.shadow" || true
