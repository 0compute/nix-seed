# exercise the graft's DRIFT path (doc/drv-seeds.md).
#
# The other workflows only ever hit the graft's identity case: the
# seeders re-run on any examples/** push, so by the time a build runs its
# checkout matches the seeded src and no graft fires. A real consumer is
# the opposite -- it seeds when dependencies change and then grafts on
# every commit -- so the path that matters most in production was the one
# path CI never took.
#
# This mutates a source file, commits it (bin/build reads the checkout
# with `git archive HEAD`, so a dirty worktree is invisible to it), and
# proves the graft realised the NEW source: the store path must change,
# regraft must be what changed it, and the built artifact must carry the
# run-unique token.
name: graft-drift

on:
  push:
    branches:
      - master
    # same seed-affecting paths the drvs builder ignores: such a change
    # goes push -> seed-drvs-examples -> workflow_run -> here, so this
    # never grafts against a stale seed.
    paths-ignore:
      - flake.lock
      - examples/**
      - mkseed/**
      - flake.nix
      - seed/action.yaml
      - bin/build-seed
      - .github/workflows/seed-drvs-examples.yaml
  workflow_run:
    workflows:
      - seed-drvs-examples
    types:
      - completed
  workflow_dispatch:

jobs:
  drift:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    name: drift (${{ matrix.example.path }}, ${{ matrix.os }})
    permissions:
      contents: read
      id-token: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        # only examples whose src is a literal path: crane's cleaned
        # source (rust, rust-ripgrep) is a derivation, so srcLocal is
        # false and no graft is attempted; eval-heavy and hello have no
        # src at all.
        example:
          - path: cpp-boost
            file: main.cpp
            literal: Nix Seed
            prog: cpp-boost-example
            # RUN the artifact rather than grepping it: the compiler
            # splits a string literal across .rodata (observed on x86:
            # "Nix Seed drift-l" + "rift-local-probe"; arm kept it
            # contiguous), so the token need not appear as contiguous
            # bytes even when the build is perfectly correct.
            verify: run
          - path: python
            file: hello.py
            literal: hello world
            prog: hello
            # the edited module is installed verbatim, so finding the
            # token in the output proves the build consumed the new src
            # -- without depending on importing torch at test time.
            verify: grep
        os:
          - ubuntu-22.04
          - ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # mount the drvs seed and build the untouched checkout. this is the
      # identity case: grafting the seeded src reproduces the baked drv,
      # so nothing should be regrafted at all.
      - uses: ./
        with:
          path: examples/${{ matrix.example.path }}
          seed_attr: seed.drvs
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: baseline (identity -- must not graft)
        id: base
        shell: bash
        run: |
          set -o pipefail
          out=$("$PWD"/bin/build examples/${{ matrix.example.path }} 2>base.log | tail -1)
          echo "baseline out: $out"
          [[ -n $out ]] || { echo "FAIL: no output path"; tail -30 base.log; exit 1; }
          if grep -q '/regraft' base.log; then
            echo "FAIL: the untouched checkout grafted; either the seed is"
            echo "stale or the .seed*.lock filtering in bin/build is wrong"
            tail -30 base.log
            exit 1
          fi
          echo "out=$out" >>"$GITHUB_OUTPUT"

      # a committed change: local to the runner, never pushed.
      - name: drift a source file
        id: drift
        shell: bash
        run: |
          token="drift-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          f=examples/${{ matrix.example.path }}/${{ matrix.example.file }}
          sed -i "s/${{ matrix.example.literal }}/${{ matrix.example.literal }} $token/" "$f"
          git diff --stat -- "$f"
          git config user.email 'ci@nix-seed.invalid'
          git config user.name 'nix-seed graft-drift'
          git commit -aqm "test: drift probe $token"
          echo "token=$token" >>"$GITHUB_OUTPUT"
          echo "probe token: $token"

      - name: build the drifted checkout (must graft)
        shell: bash
        run: |
          set -o pipefail
          out=$("$PWD"/bin/build examples/${{ matrix.example.path }} 2>drift.log | tail -1)
          echo "drifted out: $out"
          base='${{ steps.base.outputs.out }}'
          token='${{ steps.drift.outputs.token }}'

          fail() { echo "FAIL: $*"; echo '--- build log (tail)'; tail -30 drift.log; exit 1; }

          [[ -n $out ]] || fail "no output path"
          [[ $out != "$base" ]] || fail "drifted checkout realised the baseline path $base; the graft did not take effect"
          grep -q '/regraft' drift.log || fail "output changed but regraft never ran"

          # the decisive check: the realisation must reflect the edited
          # source, not merely hash differently.
          case '${{ matrix.example.verify }}' in
            run)
              got=$("$out/bin/${{ matrix.example.prog }}") \
                || fail "built artifact did not run"
              echo "artifact output: $got"
              grep -q -- "$token" <<<"$got" \
                || fail "artifact ran but did not print '$token'"
              ;;
            grep)
              grep -rqa -- "$token" "$out" \
                || fail "'$token' absent from $out"
              ;;
          esac
          echo "OK: the graft realised the edited source ($out)"
