# build each example from its seed (pull + mount + offline nix build)
name: build-examples

on:
  push:
    branches:
      - master
    paths-ignore:
      - flake.lock
      - .github/workflows/seed-examples.yaml
  workflow_run:
    workflows:
      - seed-examples
    types:
      - completed
  workflow_dispatch:

jobs:
  setup:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      examples: ${{ steps.list.outputs.examples }}
    steps:
      - uses: actions/checkout@v6
      - id: list
        uses: ./.github/actions/list-examples

  build:
    needs: setup
    permissions:
      contents: read
      id-token: write
      packages: read
    strategy:
      matrix:
        example: ${{ fromJSON(needs.setup.outputs.examples) }}
        os:
          - ubuntu-22.04
          - ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./
        with:
          path: examples/${{ matrix.example }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
