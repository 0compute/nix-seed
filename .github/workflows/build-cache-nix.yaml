# comparison: plain `nix build` with nix-community/cache-nix-action
# restoring/saving /nix/store via the GitHub Actions cache.
name: build-cache-nix

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      examples: ${{ steps.list.outputs.examples }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        uses: ./.github/actions/list-examples

  build:
    needs: setup
    permissions:
      contents: read
    strategy:
      matrix:
        example: ${{ fromJSON(needs.setup.outputs.examples) }}
        os:
          - ubuntu-22.04
          - ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: nixbuild/nix-quick-install-action@v35
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ matrix.example }}-${{ hashFiles(format('examples/{0}/**', matrix.example)) }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-${{ matrix.example }}-
      - run: nix build --print-build-logs examples/${{ matrix.example }}
